<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reporte de Seguridad | Dankel Medical</title>
  <style>
    :root {
      --primary-dark: #1d2939;
      --accent-yellow: #facc15;
      --bg-gray: #f3f4f6;
      --border-color: #d1d5db;
      --danger: #dc2626;
      --warning: #f59e0b;
      --success: #16a34a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #e5e7eb;
      color: var(--primary-dark);
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 540px;
      background: #ffffff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    /* Franja de precaución superior */
    .hazard-stripe {
      height: 14px;
      background: repeating-linear-gradient(
        -45deg,
        #1f2937,
        #1f2937 12px,
        var(--accent-yellow) 12px,
        var(--accent-yellow) 24px
      );
    }

    .header {
      text-align: center;
      padding: 24px 20px 18px;
      background-color: #f9fafb;
      border-bottom: 1px solid #e5e7eb;
    }

    .logo-container {
      max-width: 210px;
      margin: 0 auto 14px;
    }

    .header h1 {
      font-size: 1.45rem;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: #111827;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 0.9rem;
      color: #4b5563;
    }

    .timestamp-badge {
      display: inline-block;
      margin-top: 12px;
      padding: 6px 12px;
      background: #e5e7eb;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #374151;
    }

    form {
      padding: 22px 20px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label.section-label {
      display: block;
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 8px;
      color: #111827;
    }

    input[type="text"],
    textarea {
      width: 100%;
      padding: 12px;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    textarea:focus {
      outline: none;
      border-color: #2563eb;
    }

    /* Opciones de tipo de riesgo (Radio buttons estilizados) */
    .risk-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .risk-item {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .risk-item:has(input:checked) {
      border-color: #1d2939;
      background-color: #f3f4f6;
      font-weight: 600;
    }

    .risk-item input[type="radio"] {
      width: 18px;
      height: 18px;
      margin-right: 12px;
      accent-color: #1d2939;
      flex-shrink: 0;
    }

    .risk-item span {
      font-size: 0.92rem;
      line-height: 1.3;
    }

    #otro-container {
      margin-top: 10px;
      display: none;
    }

    /* Selector visual de Urgencia */
    .urgency-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .urgency-option input {
      display: none;
    }

    .urgency-box {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px 8px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      color: white;
      cursor: pointer;
      opacity: 0.45;
      transition: all 0.2s;
      border: 3px solid transparent;
    }

    .urgency-box.alto { background-color: var(--danger); }
    .urgency-box.medio { background-color: var(--warning); }
    .urgency-box.bajo { background-color: var(--success); }

    .urgency-option input:checked + .urgency-box {
      opacity: 1;
      transform: scale(1.03);
      border-color: #111827;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .btn-submit {
      width: 100%;
      padding: 15px;
      background-color: var(--primary-dark);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 8px;
    }

    .btn-submit:hover {
      background-color: #111827;
    }

    .btn-submit:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }

    /* Pantalla de confirmación */
    #success-screen {
      display: none;
      padding: 40px 24px;
      text-align: center;
    }

    .check-icon {
      width: 64px;
      height: 64px;
      background: #dcfce7;
      color: #16a34a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin: 0 auto 16px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="hazard-stripe"></div>

  <div class="header">
    <!-- Logo Dankel Medical -->
    <div class="logo-container">
      <svg viewBox="0 0 400 180" xmlns="http://www.w3.org/2000/svg" width="100%">
        <g transform="translate(135, 5) scale(0.65)">
          <path d="M100 10 C60 30, 30 70, 20 110 C55 95, 85 55, 100 10 Z" fill="#4d8b31"/>
          <path d="M20 110 C25 75, 45 45, 70 30 L50 85 Z" fill="#0b3b17"/>
          <path d="M100 10 C80 55, 50 95, 15 115 C50 105, 85 65, 100 10 Z" fill="#d1d5db"/>
          
          <path d="M115 15 C155 35, 185 75, 195 115 C160 100, 130 60, 115 15 Z" fill="#831843"/>
          <path d="M195 115 C190 80, 170 50, 145 35 L165 90 Z" fill="#3b0764"/>
          <path d="M115 15 C135 60, 165 100, 180 120 C145 105, 120 65, 115 15 Z" fill="#d1d5db"/>

          <path d="M25 135 C65 110, 145 110, 185 135 C150 155, 70 155, 25 135 Z" fill="#9ca3af"/>
          <path d="M25 135 C50 165, 80 185, 100 195 L85 160 Z" fill="#0284c7"/>
          <path d="M100 195 C125 180, 155 160, 175 140 L130 155 Z" fill="#0f172a"/>
        </g>
        <text x="200" y="165" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" letter-spacing="2">
          <tspan font-weight="bold" fill="#1e293b">DANKEL</tspan>
          <tspan font-weight="300" fill="#334155"> MEDICAL</tspan>
        </text>
      </svg>
    </div>

    <h1>REPORTE DE CONDICIÓN<br>O ACTO INSEGURO</h1>
    <p>Tu reporte ayuda a prevenir accidentes.<br>Puede ser anónimo.</p>
    <div class="timestamp-badge" id="live-clock">Cargando fecha y hora...</div>
  </div>

  <form id="safety-form">
    <!-- Ubicación -->
    <div class="form-group">
      <label class="section-label" for="ubicacion">Área o ubicación exacta *</label>
      <input type="text" id="ubicacion" name="ubicacion" placeholder="Ej. Línea 2 de ensamble, Almacén B..." required>
    </div>

    <!-- Tipo de Riesgo -->
    <div class="form-group">
      <label class="section-label">¿Qué tipo de riesgo detectaste? *</label>
      <div class="risk-options">
        <label class="risk-item">
          <input type="radio" name="tipoRiesgo" value="Equipo o maquinaria dañada / sin guardas" required>
          <span>Equipo o maquinaria dañada / sin guardas</span>
        </label>
        <label class="risk-item">
          <input type="radio" name="tipoRiesgo" value="Derrame, piso resbaloso o falta de orden">
          <span>Derrame, piso resbaloso o falta de orden</span>
        </label>
        <label class="risk-item">
          <input type="radio" name="tipoRiesgo" value="Riesgo eléctrico (cables expuestos)">
          <span>Riesgo eléctrico (cables expuestos)</span>
        </label>
        <label class="risk-item">
          <input type="radio" name="tipoRiesgo" value="Falta de Equipo de Protección Personal (EPP)">
          <span>Falta de Equipo de Protección Personal (EPP)</span>
        </label>
        <label class="risk-item">
          <input type="radio" name="tipoRiesgo" value="Condición estructural (iluminación, escaleras)">
          <span>Condición estructural (iluminación, escaleras)</span>
        </label>
        <label class="risk-item">
          <input type="radio" name="tipoRiesgo" value="Otro" id="radio-otro">
          <span>Otro</span>
        </label>
      </div>

      <!-- Campo condicional para "Otro" -->
      <div id="otro-container">
        <input type="text" id="otroRiesgo" name="otroRiesgo" placeholder="Especifique qué tipo de riesgo detectó...">
      </div>
    </div>

    <!-- Descripción -->
    <div class="form-group">
      <label class="section-label" for="descripcion">Descripción breve del peligro *</label>
      <textarea id="descripcion" name="descripcion" rows="3" placeholder="Describe qué observaste y por qué representa un riesgo..." required></textarea>
    </div>

    <!-- Nivel de Urgencia -->
    <div class="form-group">
      <label class="section-label">Nivel de urgencia *</label>
      <div class="urgency-grid">
        <label class="urgency-option">
          <input type="radio" name="urgencia" value="Alto" required>
          <div class="urgency-box alto">Alto</div>
        </label>
        <label class="urgency-option">
          <input type="radio" name="urgencia" value="Medio">
          <div class="urgency-box medio">Medio</div>
        </label>
        <label class="urgency-option">
          <input type="radio" name="urgencia" value="Bajo">
          <div class="urgency-box bajo">Bajo</div>
        </label>
      </div>
    </div>

    <!-- Acción Inmediata -->
    <div class="form-group">
      <label class="section-label" for="accionInmediata">¿Se tomó alguna acción inmediata? *</label>
      <input type="text" id="accionInmediata" name="accionInmediata" placeholder="Ej. Se acordonó el área, se avisó al supervisor, ninguna..." required>
    </div>

    <!-- Reportante -->
    <div class="form-group">
      <label class="section-label" for="reportante">Nombre del reportante (Opcional)</label>
      <input type="text" id="reportante" name="reportante" placeholder="Déjalo en blanco si deseas que sea anónimo">
    </div>

    <button type="submit" class="btn-submit" id="submit-btn">ENVIAR REPORTE</button>
  </form>

  <!-- Pantalla de éxito -->
  <div id="success-screen">
    <div class="check-icon">✓</div>
    <h2 style="margin-bottom: 10px;">¡Reporte Registrado!</h2>
    <p style="color: #4b5563; margin-bottom: 24px;">Gracias por contribuir a mantener un entorno seguro en Dankel Medical.</p>
    <button class="btn-submit" onclick="resetForm()">Enviar otro reporte</button>
  </div>
</div>

<script>
  // PEGA AQUÍ LA URL DE TU GOOGLE APPS SCRIPT
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxfMwX4HedLVgoOrZiYx0mv6KBmqkRGrQ8pyjsyQAgHFPo5dRIa37ko55PC7pecEeUf/exec';

  // Reloj automático en tiempo real
  function updateClock() {
    const now = new Date();
    const formatted = now.toLocaleDateString('es-MX', {
      day: '2-digit', month: '2-digit', year: 'numeric',
      hour: '2-digit', minute: '2-digit', second: '2-digit'
    });
    document.getElementById('live-clock').textContent = `📅 ${formatted}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  // Mostrar/ocultar campo de texto cuando se selecciona "Otro"
  const radiosRiesgo = document.querySelectorAll('input[name="tipoRiesgo"]');
  const otroContainer = document.getElementById('otro-container');
  const otroInput = document.getElementById('otroRiesgo');

  radiosRiesgo.forEach(radio => {
    radio.addEventListener('change', (e) => {
      if (e.target.value === 'Otro') {
        otroContainer.style.display = 'block';
        otroInput.required = true;
        otroInput.focus();
      } else {
        otroContainer.style.display = 'none';
        otroInput.required = false;
        otroInput.value = '';
      }
    });
  });

  // Envío de datos al Google Sheet
  const form = document.getElementById('safety-form');
  const submitBtn = document.getElementById('submit-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    if (SCRIPT_URL === 'TU_URL_DE_GOOGLE_APPS_SCRIPT_AQUI') {
      alert('Falta configurar la URL de Google Apps Script en el código.');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Enviando reporte...';

    const formData = new FormData(form);
    const payload = {
      ubicacion: formData.get('ubicacion'),
      tipoRiesgo: formData.get('tipoRiesgo'),
      otroRiesgo: formData.get('otroRiesgo'),
      descripcion: formData.get('descripcion'),
      urgencia: formData.get('urgencia'),
      accionInmediata: formData.get('accionInmediata'),
      reportante: formData.get('reportante')
    };

    try {
      await fetch(SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      form.style.display = 'none';
      document.getElementById('success-screen').style.display = 'block';
    } catch (error) {
      alert('Ocurrió un error al enviar el reporte. Verifica tu conexión a internet.');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'ENVIAR REPORTE';
    }
  });

  function resetForm() {
    form.reset();
    otroContainer.style.display = 'none';
    document.getElementById('success-screen').style.display = 'none';
    form.style.display = 'block';
  }
</script>

</body>
</html>
